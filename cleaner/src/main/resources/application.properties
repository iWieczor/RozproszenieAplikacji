spring.main.web-application-type=none

spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.keyspace-name=urlshortener
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=create_if_not_exists

# Strategia usuwania: BY_CREATION lub BY_LAST_USED
cleaner.strategy=BY_CREATION

# Czas życia wpisu (ISO 8601 Duration) — wpisy starsze od tego progu są usuwane
# PT30S = 30 sekund (do demo), P90D = 90 dni, P1Y = 1 rok
cleaner.ttl=PT30S

# Cron uruchamiania cleanera (spring format: sekunda minuta godzina dzień miesiąc dzień-tygodnia)
# 0/30 * * * * * = co 30 sekund
cleaner.cron=0/30 * * * * *
