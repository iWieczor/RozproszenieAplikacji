services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urluser
      POSTGRES_PASSWORD: urlpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urluser -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  writer:
    build:
      context: .
      dockerfile: writer/Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urlshortener
      SPRING_DATASOURCE_USERNAME: urluser
      SPRING_DATASOURCE_PASSWORD: urlpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      URL_SHORTENER_BASE_URL: http://localhost:8082
    depends_on:
      postgres:
        condition: service_healthy

  reader:
    build:
      context: .
      dockerfile: reader/Dockerfile
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urlshortener
      SPRING_DATASOURCE_USERNAME: urluser
      SPRING_DATASOURCE_PASSWORD: urlpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      URL_SHORTENER_BASE_URL: http://localhost:8082
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
