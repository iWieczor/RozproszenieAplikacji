services:

  cassandra1:
    image: cassandra:4.1
    container_name: cassandra1
    mem_limit: 1g
    environment:
      CASSANDRA_CLUSTER_NAME: url-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_SEEDS: cassandra1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  cassandra2:
    image: cassandra:4.1
    container_name: cassandra2
    mem_limit: 1g
    environment:
      CASSANDRA_CLUSTER_NAME: url-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_SEEDS: cassandra1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      cassandra1:
        condition: service_healthy

  cassandra3:
    image: cassandra:4.1
    container_name: cassandra3
    mem_limit: 1g
    environment:
      CASSANDRA_CLUSTER_NAME: url-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_SEEDS: cassandra1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      cassandra2:
        condition: service_healthy

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra1:
        condition: service_healthy
    volumes:
      - ./cassandra/init.cql:/init.cql
    command: cqlsh cassandra1 -f /init.cql
    restart: on-failure

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    mem_limit: 1g
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  writer:
    build:
      context: .
      dockerfile: writer/Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra1
      SPRING_CASSANDRA_PORT: 9042
      SPRING_CASSANDRA_KEYSPACE_NAME: urlshortener
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_SCHEMA_ACTION: create_if_not_exists
      URL_SHORTENER_BASE_URL: http://localhost:8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Lista zakazanych slow (po przecinku) - nadpisuje domyslna z application.properties
      BLOCKLIST_WORDS: casino,porn,malware,phishing,xxx
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  reader:
    build:
      context: .
      dockerfile: reader/Dockerfile
    ports:
      - "8082:8080"
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra1
      SPRING_CASSANDRA_PORT: 9042
      SPRING_CASSANDRA_KEYSPACE_NAME: urlshortener
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_SCHEMA_ACTION: create_if_not_exists
      URL_SHORTENER_BASE_URL: http://localhost:8082
    depends_on:
      cassandra-init:
        condition: service_completed_successfully

  cleaner:
    build:
      context: .
      dockerfile: cleaner/Dockerfile
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra1
      SPRING_CASSANDRA_PORT: 9042
      SPRING_CASSANDRA_KEYSPACE_NAME: urlshortener
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_SCHEMA_ACTION: create_if_not_exists
      # Strategia: BY_CREATION lub BY_LAST_USED
      CLEANER_STRATEGY: BY_CREATION
      # Próg TTL (ISO 8601): PT30S=30s, P90D=90 dni, P1Y=rok
      CLEANER_TTL: PT30S
      # Cron: co 30 sekund
      CLEANER_CRON: "0/30 * * * * *"
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
