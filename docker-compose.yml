services:

  cassandra1:
    image: cassandra:4.1
    container_name: cassandra1
    mem_limit: 1g
    environment:
      CASSANDRA_CLUSTER_NAME: url-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_SEEDS: cassandra1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  cassandra2:
    image: cassandra:4.1
    container_name: cassandra2
    mem_limit: 1g
    environment:
      CASSANDRA_CLUSTER_NAME: url-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_SEEDS: cassandra1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      cassandra1:
        condition: service_healthy

  cassandra3:
    image: cassandra:4.1
    container_name: cassandra3
    mem_limit: 1g
    environment:
      CASSANDRA_CLUSTER_NAME: url-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_SEEDS: cassandra1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      cassandra2:
        condition: service_healthy

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra1:
        condition: service_healthy
    volumes:
      - ./cassandra/init.cql:/init.cql
    command: cqlsh cassandra1 -f /init.cql
    restart: on-failure

  writer:
    build:
      context: .
      dockerfile: writer/Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra1
      SPRING_CASSANDRA_PORT: 9042
      SPRING_CASSANDRA_KEYSPACE_NAME: urlshortener
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_SCHEMA_ACTION: create_if_not_exists
      URL_SHORTENER_BASE_URL: http://localhost:8082
    depends_on:
      cassandra-init:
        condition: service_completed_successfully

  reader:
    build:
      context: .
      dockerfile: reader/Dockerfile
    ports:
      - "8082:8080"
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra1
      SPRING_CASSANDRA_PORT: 9042
      SPRING_CASSANDRA_KEYSPACE_NAME: urlshortener
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_SCHEMA_ACTION: create_if_not_exists
      URL_SHORTENER_BASE_URL: http://localhost:8082
    depends_on:
      cassandra-init:
        condition: service_completed_successfully

  cleaner:
    build:
      context: .
      dockerfile: cleaner/Dockerfile
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra1
      SPRING_CASSANDRA_PORT: 9042
      SPRING_CASSANDRA_KEYSPACE_NAME: urlshortener
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_SCHEMA_ACTION: create_if_not_exists
      # Strategia: BY_CREATION lub BY_LAST_USED
      CLEANER_STRATEGY: BY_CREATION
      # Próg TTL (ISO 8601): PT30S=30s, P90D=90 dni, P1Y=rok
      CLEANER_TTL: PT30S
      # Cron: co 30 sekund
      CLEANER_CRON: "0/30 * * * * *"
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
